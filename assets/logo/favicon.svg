<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Favicon: same clutch-disc mark, navy on white, sized for 16-32px legibility.
       Detail is reduced (heavier strokes, shorter spokes) so it survives at tab size. -->
  <rect width="100" height="100" rx="14" fill="#ffffff"/>
  <g fill="none" stroke="#1e3a8a" stroke-linecap="round">
    <circle cx="50" cy="50" r="38" stroke-width="7"/>
    <circle cx="50" cy="50" r="23" stroke-width="5"/>
    <g stroke-width="5">
      <path d="M75 50h7"/>
      <path d="M50 25v-7"/>
      <path d="M25 50h-7"/>
      <path d="M50 75v7"/>
    </g>
  </g>
  <circle cx="50" cy="50" r="8" fill="#1e3a8a"/>
</svg>
